; Standalone ESP32-S3 firmware of this repository: plays assets/rabbit3.iska on the
; robot's ILI9341 panel (240x320), with the asset **embedded in the binary**.
;
;     pio run -t upload              # or: python tools/flash_esp32.py
;     pio device monitor
;
; Nothing of Intellar-Engine is modified or copied: `src/Iska/` is used as it is,
; through the tiny `library.json` it carries (and it is host agnostic -- see the
; "Reusing ISKA in any host" section of the README). The panel is driven with the
; Arduino SPI directly, so there is no third-party library to download.
;
; Macros: see src/lcd_config.h (pins, -DANIM_ROTATION/-DANIM_DX/-DANIM_DY,
; -DANIM_SPI_HZ, -DANIM_AUTO_MS, -DANIM_USE_LITTLEFS).

[platformio]
default_envs = s3

[env:s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
upload_speed = 921600
monitor_speed = 115200
monitor_filters = colorize
board_build.flash_mode = qio
board_build.flash_size = 8MB
board_build.partitions = default_8MB.csv
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
; the asset travels with the firmware: no LittleFS, no upload step (the copy is
; staged by extra_script.py, so the embedded symbols do not depend on the path of
; the repository -- see that file)
extra_scripts = pre:extra_script.py
board_build.embed_files = assets/rabbit3.iska

build_flags =
    -std=gnu++17
    -O2
    -Wall
    -I../../src
    -DISKA_BLOB_START=_binary_assets_rabbit3_iska_start
    -DISKA_BLOB_END=_binary_assets_rabbit3_iska_end

lib_deps =
    symlink://../../src/Iska
